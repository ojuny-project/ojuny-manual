name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build self-extracting bundle
        run: |
          mkdir -p dist
          nix bundle .#default -o dist/ojuny-manual
          cp -L dist/ojuny-manual "dist/ojuny-manual-$(uname -m)"
          rm -f dist/ojuny-manual
          sha256sum dist/ojuny-manual-* > dist/SHA256SUMS
          mv dist/SHA256SUMS SHA256SUMS

      # The release also publishes a small flake. Add it as an input and use
      # packages.<system>.ojuny-manual. The fetchurl hash pins the downloaded
      # bundle, so the package is reproducible without a cache.
      - name: Generate release flake
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sha=$(sha256sum "dist/ojuny-manual-$(uname -m)" | cut -d' ' -f1)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p dist/flake
          cat > dist/flake/flake.nix <<EOF
          {
            inputs.nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";

            outputs = { self, nixpkgs }:
              let
                systems = [ "x86_64-linux" ];
                assetNames = {
                  x86_64-linux = "ojuny-manual-x86_64";
                };
                forAllSystems = f: nixpkgs.lib.genAttrs systems (system: f nixpkgs.legacyPackages.\${system} system);
                mk = pkgs: system: pkgs.stdenvNoCC.mkDerivation {
                  pname = "ojuny-manual";
                  version = "${TAG}";
                  src = pkgs.fetchurl {
                    url = "${base}/\${assetNames.\${system}}";
                    sha256 = "${sha}";
                  };
                  dontUnpack = true;
                  installPhase = "install -Dm755 \$src \$out/bin/ojuny-manual";
                };
              in {
                packages = forAllSystems (pkgs: system: {
                  ojuny-manual = mk pkgs system;
                  default = mk pkgs system;
                });
              };
          }
          EOF
          tar -czf dist/ojuny-manual-flake.tar.gz -C dist/flake flake.nix

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/ojuny-manual-*
            SHA256SUMS
          fail_on_unmatched_files: true
